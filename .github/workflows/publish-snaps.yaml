name: publish-snaps

on:
  workflow_dispatch:
    inputs:
      coder_version:
        description: "Coder version"
        required: true
      release_channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - stable
          - mainline
  repository_dispatch:
    types: [coder-release]

permissions: {}

jobs:
  build-and-publish:
    runs-on: ${{ matrix.os }}
    name: publish-snaps
    # Holds SNAPCRAFT_TOKEN; only main may use it. coder/coder's approved release dispatches this
    # workflow on main.
    environment: publish
    permissions:
      contents: read
    strategy:
      matrix:
        os:
          - depot-ubuntu-22.04
          - depot-ubuntu-22.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.client_payload.coder_version }}
          DISPATCH_CHANNEL: ${{ github.event.client_payload.release_channel }}
          INPUT_VERSION: ${{ github.event.inputs.coder_version }}
          INPUT_CHANNEL: ${{ github.event.inputs.release_channel }}
        run: |
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            version="$DISPATCH_VERSION"; channel="$DISPATCH_CHANNEL"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"; channel="$INPUT_CHANNEL"
          else
            echo "Unknown event: $EVENT_NAME"
            exit 1
          fi
          [[ "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::unexpected coder_version '$version'"; exit 1; }
          echo "coder_version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$channel" == "stable" ]]; then
            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
          else
            echo "release_channel=candidate" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version in snapcraft.yaml
        env:
          CODER_VERSION: ${{ steps.metadata.outputs.coder_version }}
        run: |
          sed -i "s/version: \".*\"/version: \"${CODER_VERSION}\"/" snap/snapcraft.yaml
          git diff snap/snapcraft.yaml

      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build
        if: ${{ steps.metadata.outputs.release_channel == 'candidate' }}

      - uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        if: ${{ steps.metadata.outputs.release_channel == 'candidate' }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
